<script>
window.addEventListener('DOMContentLoaded', function() {
    function setupFormBypass() {
        var form = document.querySelector('form');
        var btn = document.querySelector('button[type="submit"], button.framer-l1C7M');
        
        if (!form || !btn || btn.dataset.bypassed) return;
        
        // Clone the button to remove React event listeners attached to it
        var newBtn = btn.cloneNode(true);
        newBtn.type = 'button'; // Prevent native form submission
        newBtn.dataset.bypassed = 'true';
        
        // Replace the button in the DOM
        btn.parentNode.replaceChild(newBtn, btn);
        
        function submitFormAjax() {
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }
            
            // Change button text to indicate loading
            var textElement = newBtn.querySelector('p') || newBtn;
            var originalText = textElement.innerText;
            textElement.innerText = "Sending...";
            newBtn.style.opacity = "0.7";
            newBtn.disabled = true;
            
            // Gather data
            var formData = new FormData(form);
            var data = {};
            formData.forEach(function(value, key) {
                // Ignore the injected Google reCAPTCHA response field so it doesn't clutter the email
                if (key !== 'g-recaptcha-response' && !key.toLowerCase().includes('recaptcha')) {
                    data[key] = value;
                }
            });
            
            // Remove honeypots from data
            var honeypots = form.querySelectorAll('input[tabindex="-1"], input[aria-hidden="true"]');
            honeypots.forEach(function(inp) { 
                delete data[inp.name]; 
            });
            
            // Add FormSubmit specific fields
            data['_captcha'] = 'false';
            data['_subject'] = 'New Website Contact Form Submission';
            data['_template'] = 'box'; // Makes the email look much cleaner
            
            fetch('https://formsubmit.co/ajax/theminorprophets1@gmail.com', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(function(response) {
                return response.json();
            })
            .then(function(result) {
                if (result.success) {
                    window.location.replace(new URL('thankyou.html', window.location.href).href);
                } else {
                    alert('Submission failed: ' + (result.message || 'Unknown error'));
                    textElement.innerText = originalText;
                    newBtn.style.opacity = "1";
                    newBtn.disabled = false;
                }
            })
            .catch(function(error) {
                console.error('Error:', error);
                alert('Network error. Please try again.');
                textElement.innerText = originalText;
                newBtn.style.opacity = "1";
                newBtn.disabled = false;
            });
        }
        
        newBtn.addEventListener('click', function(e) {
            e.preventDefault();
            submitFormAjax();
        });
        
        // Catch Enter key submissions
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            submitFormAjax();
        }, true);
    }

    // Try setting up immediately
    setupFormBypass();
    
    // Also try after a short delay in case Framer hydrates late
    setTimeout(setupFormBypass, 500);
    setTimeout(setupFormBypass, 1500);
});
